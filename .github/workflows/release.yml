name: Release

# Publishes a GitHub release automatically after a merge to main.
#
# The version comes from the code: LapFund\App::VERSION in src/App.php.
#  - If release v<version> does not exist yet: run the tests, build the ZIP
#    (application + all libraries from composer.lock), create the tag v<version>
#    on the merged commit and publish the release. Release notes: the section of
#    that version in CHANGELOG.md (otherwise generated by GitHub).
#  - If it exists already (e.g. a merge that only changes docs): nothing to do,
#    the run ends green with a notice.
#
# So for a new release: raise App::VERSION and add a CHANGELOG.md section in the
# pull request, then merge. Versions like 1.3.0-beta.1 become pre-releases.
#
# "Run workflow" (Actions › Release) does the same by hand, e.g. to retry after a
# failed run.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Never two release runs at the same time; a newer merge waits for the running one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Version from the code
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are only made from main."; exit 1
          fi
          VERSION=$(php -r 'require "src/App.php"; echo LapFund\App::VERSION;')
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::App::VERSION '$VERSION' in src/App.php is not of the form 1.2.3 or 1.2.3-beta.1"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" > /dev/null 2>&1; then
            echo "::notice::Release v$VERSION exists already – nothing to do. Raise App::VERSION in src/App.php for a new release."
            echo "new=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null 2>&1; then
            echo "::error::Tag v$VERSION exists, but there is no release for it. Delete the tag or raise App::VERSION."; exit 1
          else
            echo "::notice::Publishing release v$VERSION"
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$VERSION" | grep -q -- '-'; then echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"; fi

      - name: Tests
        if: steps.v.outputs.new == 'true'
        run: composer install --no-interaction --no-progress && vendor/bin/phpunit && composer audit --no-dev

      - name: Build ZIP
        if: steps.v.outputs.new == 'true'
        run: bin/build-release.sh "${{ steps.v.outputs.version }}"

      - name: Create GitHub release
        if: steps.v.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes: the section of this version in CHANGELOG.md, otherwise generated by GitHub.
          awk -v v="[${{ steps.v.outputs.version }}]" '/^## \[/ { p = index($0, v) > 0; next } p' CHANGELOG.md > build/notes.md || true
          if [ -s build/notes.md ]; then NOTES=(--notes-file build/notes.md); else NOTES=(--generate-notes); fi
          gh release create "${{ steps.v.outputs.tag }}" \
            "build/lapfund-${{ steps.v.outputs.version }}.zip" \
            --target "$GITHUB_SHA" \
            --title "LapFund ${{ steps.v.outputs.tag }}" \
            "${NOTES[@]}" ${{ steps.v.outputs.prerelease }}
